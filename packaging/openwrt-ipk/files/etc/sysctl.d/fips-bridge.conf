# FIPS: bridge netfilter settings
#
# The package loads br_netfilter (kmod-br-netfilter) and this file turns
# off its IP/IPv6/ARP call hooks, so frames the bridge forwards are not
# also run through the firewall's IP, IPv6 and ARP tables.
#
# Loading br_netfilter does not make a bridge member port usable for the
# FIPS Ethernet transport. A lab test with a two-member Linux bridge found
# that a socket bound to a member port never forms a link, with
# br_netfilter unloaded, loaded with these hooks off, or loaded with them
# on. A socket bound to the bridge itself (br-lan) works, both with
# br_netfilter unloaded and with it loaded as this file sets it.
# Bind the bridge. The module, its dependency and this file stay until
# their removal has been checked on a router.
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-arptables=0
